<svg viewBox="0 0 920 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="460" fill="#ffffff"/>

  <text x="460" y="30" text-anchor="middle" font-size="17" font-weight="600" fill="#222">
    Mapeo de (S, f, &#937;) al grafo de construcción G_C — §2.2.1
  </text>

  <!-- Columna 1: (S,f,Omega) -->
  <rect x="20" y="70" width="230" height="220" rx="10" fill="#e8f0fe" stroke="#3b5bab" stroke-width="1.5"/>
  <text x="135" y="98" text-anchor="middle" font-size="15" font-weight="600" fill="#20305c">(S, f, &#937;(t))</text>
  <text x="135" y="98" text-anchor="middle" font-size="15" font-weight="600" fill="#20305c" dy="0"></text>
  <text x="40" y="130" font-size="12.5" fill="#20305c">S : conjunto de</text>
  <text x="40" y="147" font-size="12.5" fill="#20305c">soluciones candidatas</text>

  <text x="40" y="177" font-size="12.5" fill="#20305c">f(s,t) : función objetivo</text>
  <text x="40" y="194" font-size="12.5" fill="#20305c">(costo), posiblemente</text>
  <text x="40" y="211" font-size="12.5" fill="#20305c">dependiente de t</text>

  <text x="40" y="241" font-size="12.5" fill="#20305c">&#937;(t) : conjunto de</text>
  <text x="40" y="258" font-size="12.5" fill="#20305c">restricciones, posiblemente</text>
  <text x="40" y="275" font-size="12.5" fill="#20305c">dependiente de t</text>

  <text x="135" y="332" text-anchor="middle" font-size="11.5" fill="#666" font-style="italic">§2.1 / §2.2.1</text>

  <!-- Flecha 1 -->
  <line x1="255" y1="180" x2="320" y2="180" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="287" y="168" text-anchor="middle" font-size="11.5" fill="#555">se mapea</text>
  <text x="287" y="200" text-anchor="middle" font-size="11.5" fill="#555">sobre</text>

  <!-- Columna 2: C, X, Xtilde, Stilde -->
  <rect x="325" y="55" width="260" height="250" rx="10" fill="#fff2cc" stroke="#9c7a1e" stroke-width="1.5"/>
  <text x="455" y="82" text-anchor="middle" font-size="15" font-weight="600" fill="#5c4813">Representación operativa</text>

  <text x="345" y="112" font-size="12.5" fill="#5c4813" font-weight="600">C = {c&#8321;, c&#8322;, ..., c_Nc}</text>
  <text x="345" y="129" font-size="12" fill="#5c4813">componentes (piezas atómicas)</text>

  <text x="345" y="159" font-size="12.5" fill="#5c4813" font-weight="600">X : estados = secuencias</text>
  <text x="345" y="176" font-size="12" fill="#5c4813">sobre C, de longitud &#8804; n</text>

  <text x="345" y="206" font-size="12.5" fill="#5c4813" font-weight="600">X&#771; &#8838; X : factibilidad débil</text>
  <text x="345" y="223" font-size="12" fill="#5c4813">"no imposible" completar x</text>

  <text x="345" y="253" font-size="12.5" fill="#5c4813" font-weight="600">S&#771; &#8838; S : soluciones</text>
  <text x="345" y="270" font-size="12" fill="#5c4813">factibles completas</text>

  <text x="455" y="292" text-anchor="middle" font-size="11.5" fill="#7a5f10" font-style="italic">§2.2.1 — Definición 1</text>

  <!-- Flecha 2 -->
  <line x1="590" y1="180" x2="655" y2="180" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="622" y="168" text-anchor="middle" font-size="11.5" fill="#555">define la</text>
  <text x="622" y="200" text-anchor="middle" font-size="11.5" fill="#555">topología de</text>

  <!-- Columna 3: G_C grafo completo -->
  <rect x="660" y="55" width="235" height="250" rx="10" fill="#e6f4ea" stroke="#2f7a43" stroke-width="1.5"/>
  <text x="777" y="82" text-anchor="middle" font-size="15" font-weight="600" fill="#1e4d2b">G_C = (C, L)</text>
  <text x="777" y="100" text-anchor="middle" font-size="12" fill="#1e4d2b">grafo de construcción</text>
  <text x="777" y="115" text-anchor="middle" font-size="12" fill="#1e4d2b">(siempre completo)</text>

  <!-- pentagono de nodos, completamente conectado -->
  <g stroke="#2f7a43" stroke-width="1.1" opacity="0.85">
    <line x1="777" y1="140" x2="850" y2="185"/>
    <line x1="777" y1="140" x2="825" y2="255"/>
    <line x1="777" y1="140" x2="729" y2="255"/>
    <line x1="777" y1="140" x2="704" y2="185"/>
    <line x1="850" y1="185" x2="825" y2="255"/>
    <line x1="850" y1="185" x2="729" y2="255"/>
    <line x1="850" y1="185" x2="704" y2="185"/>
    <line x1="825" y1="255" x2="729" y2="255"/>
    <line x1="825" y1="255" x2="704" y2="185"/>
    <line x1="729" y1="255" x2="704" y2="185"/>
  </g>
  <g>
    <circle cx="777" cy="140" r="9" fill="#2f7a43"/>
    <circle cx="850" cy="185" r="9" fill="#2f7a43"/>
    <circle cx="825" cy="255" r="9" fill="#2f7a43"/>
    <circle cx="729" cy="255" r="9" fill="#2f7a43"/>
    <circle cx="704" cy="185" r="9" fill="#2f7a43"/>
  </g>
  <text x="777" y="292" text-anchor="middle" font-size="11.5" fill="#1e4d2b" font-style="italic">nodos = C, L conecta todo</text>

  <!-- Nota inferior -->
  <rect x="20" y="330" width="875" height="105" rx="8" fill="#fdecea" stroke="#b3382c" stroke-width="1.3"/>
  <text x="35" y="355" font-size="12.5" font-weight="600" fill="#7a231a">Nota importante:</text>
  <text x="35" y="376" font-size="12" fill="#7a231a">&#937;(t) NO se codifica en la topología de G_C — G_C es siempre un grafo completo. Las restricciones</text>
  <text x="35" y="395" font-size="12" fill="#7a231a">se implementan en la política de recorrido de las hormigas (dura: solo soluciones factibles; o blanda:</text>
  <text x="35" y="414" font-size="12" fill="#7a231a">se permiten soluciones infactibles s &#8712; S \ S&#771;, penalizadas según su grado de infactibilidad).</text>
</svg>
